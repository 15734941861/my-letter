<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>一封信</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #1b1714 0%,
      #100e0c 45%,
      #090807 100%
    );

  color:#eee0c8;

  font-family:
    "Songti SC",
    "STSong",
    serif;
}


/* =========================
   通用页面
========================= */

.page{
  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:100%;

  display:none;

  overflow:auto;
}


/* =========================
   粒子画布
========================= */

#particleCanvas{
  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  z-index:550;

  pointer-events:none;
}


/* =========================
   写信首页
========================= */

#writePage{
  display:flex;

  z-index:100;

  align-items:center;
  justify-content:center;

  padding:24px;
}


.write-box{
  width:100%;
  max-width:560px;

  text-align:center;
}


.title{
  margin-bottom:14px;

  font-size:24px;

  font-weight:400;

  letter-spacing:0.45em;

  text-indent:0.45em;

  color:#f2dfbd;
}


.subtitle{
  margin-bottom:28px;

  font-size:13px;

  color:rgba(240,220,190,0.45);

  letter-spacing:0.12em;
}


#letterInput{
  display:block;

  width:100%;
  height:260px;

  padding:20px;

  border:
    1px solid
    rgba(240,200,140,0.22);

  border-radius:10px;

  outline:none;

  resize:none;

  background:
    rgba(255,245,225,0.045);

  color:#f1dfc3;

  font-family:inherit;

  font-size:16px;

  line-height:1.9;
}


#letterInput::placeholder{
  color:
    rgba(240,220,190,0.25);
}


.count{
  margin-top:10px;

  text-align:left;

  font-size:12px;

  color:
    rgba(240,220,190,0.38);
}


#sendBtn{
  margin-top:25px;

  min-width:150px;

  padding:13px 30px;

  border:
    1px solid
    rgba(240,200,140,0.38);

  border-radius:999px;

  background:
    rgba(255,235,200,0.04);

  color:#f2dfbd;

  font-family:inherit;

  font-size:15px;

  letter-spacing:0.3em;

  cursor:pointer;
}


#sendBtn:disabled{
  opacity:0.4;
}


/* =========================
   加载
========================= */

#loadingPage{
  z-index:200;

  align-items:center;
  justify-content:center;

  color:
    rgba(240,220,190,0.55);

  font-size:14px;

  letter-spacing:0.25em;
}


/* =========================
   分享页面
========================= */

#sharePage{
  z-index:300;

  align-items:center;
  justify-content:center;

  padding:24px;
}


.share-box{
  width:100%;
  max-width:500px;

  text-align:center;
}


.share-icon{
  display:flex;

  width:66px;
  height:66px;

  margin:0 auto 22px;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(240,200,140,0.25);

  border-radius:50%;

  font-size:28px;
}


.share-title{
  margin-bottom:12px;

  font-size:22px;

  letter-spacing:0.18em;
}


.share-description{
  margin-bottom:22px;

  color:
    rgba(240,220,190,0.48);

  font-size:13px;

  line-height:1.8;
}


#shareURL{
  width:100%;

  margin-bottom:18px;

  padding:14px;

  border:
    1px solid
    rgba(240,200,140,0.15);

  border-radius:8px;

  background:
    rgba(255,245,225,0.04);

  color:
    rgba(240,220,190,0.7);

  text-align:left;

  font-family:Arial,sans-serif;

  font-size:11px;

  line-height:1.5;

  word-break:break-all;
}


.share-button{
  width:100%;
  height:48px;

  margin-bottom:11px;

  border:
    1px solid
    rgba(240,200,140,0.32);

  border-radius:999px;

  background:
    rgba(255,235,200,0.055);

  color:#f2dfbd;

  font-family:inherit;

  font-size:14px;
}


.two-buttons{
  display:flex;
  gap:10px;
}


.two-buttons button{
  flex:1;
}


.secondary{
  height:44px;

  border:
    1px solid
    rgba(240,200,140,0.18);

  border-radius:999px;

  background:transparent;

  color:
    rgba(242,223,189,0.75);

  font-family:inherit;
}


#againBtn{
  margin-top:17px;

  border:none;

  background:transparent;

  color:
    rgba(240,220,190,0.42);

  font-family:inherit;
}


#shareStatus{
  height:25px;

  margin-top:12px;

  color:
    rgba(240,220,190,0.55);

  font-size:12px;
}


/* =========================
   信封
========================= */

#envelopePage{
  z-index:400;

  align-items:center;
  justify-content:center;

  flex-direction:column;
}


.envelope{
  position:relative;

  width:260px;
  max-width:68vw;

  aspect-ratio:1.5 / 1;

  cursor:pointer;

  perspective:700px;

  animation:
    floatEnvelope
    3s
    ease-in-out
    infinite;
}


@keyframes floatEnvelope{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }

}


.envelope-body{
  position:absolute;

  inset:0;

  border-radius:6px;

  background:
    linear-gradient(
      145deg,
      #f7ead0,
      #e5d0a8
    );

  box-shadow:
    0 25px 55px
    rgba(0,0,0,0.55);
}


.envelope-flap{
  position:absolute;

  inset:0;

  background:
    linear-gradient(
      #e8d4ae,
      #d3bc90
    );

  clip-path:
    polygon(
      0 0,
      50% 58%,
      100% 0
    );

  transform-origin:top;

  transition:
    transform 0.8s ease;
}


.envelope.open .envelope-flap{
  transform:rotateX(180deg);
}


.seal{
  position:absolute;

  top:50%;
  left:50%;

  z-index:10;

  display:flex;

  width:48px;
  height:48px;

  align-items:center;
  justify-content:center;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #df5144,
      #9f2c23
    );

  box-shadow:
    0 5px 14px
    rgba(0,0,0,0.45);

  color:#f8e7c9;

  font-size:20px;

  transition:
    opacity 0.5s,
    transform 0.5s;
}


.envelope.open .seal{
  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(0.5);
}


.open-tip{
  margin-top:34px;

  color:
    rgba(240,220,190,0.52);

  font-size:13px;

  letter-spacing:0.35em;

  text-indent:0.35em;
}


/* =========================
   信纸
========================= */

#readPage{
  z-index:500;

  align-items:center;
  justify-content:center;

  padding:22px;
}


.paper{
  width:100%;
  max-width:620px;

  height:76vh;

  overflow:auto;

  padding:
    40px
    34px;

  border-radius:5px;

  background:
    radial-gradient(
      circle at 25% 5%,
      #fffef9,
      #f6eedf 60%,
      #eadfc9
    );

  box-shadow:
    0 35px 80px
    rgba(0,0,0,0.7);

  color:#3d342a;

  font-size:17px;

  line-height:2.1;

  letter-spacing:0.05em;

  opacity:1;

  transform:scale(1);

  filter:blur(0);

  transition:
    opacity 1.8s ease,
    transform 1.8s ease,
    filter 1.8s ease;
}


.paper.disappear{
  opacity:0;

  transform:
    translateY(-14px)
    scale(1.035);

  filter:blur(7px);
}


#letterText{
  white-space:pre-wrap;

  word-break:break-word;
}


/* =========================
   再读提示
========================= */

#replayTip{
  position:fixed;

  bottom:7vh;
  left:50%;

  z-index:600;

  display:none;

  transform:
    translateX(-50%);

  color:
    rgba(240,220,190,0.5);

  font-size:12px;

  letter-spacing:0.2em;

  white-space:nowrap;
}


@media(max-width:600px){

  #letterInput{
    height:230px;
  }

  .paper{
    height:72vh;

    padding:
      32px
      25px;

    font-size:16px;
  }

}

</style>
</head>


<body>


<!-- 粒子 -->
<canvas id="particleCanvas"></canvas>


<!-- 写信 -->

<div class="page" id="writePage">

  <div class="write-box">

    <h1 class="title">
      写一封信
    </h1>

    <div class="subtitle">
      有些话，适合慢一点说
    </div>

    <textarea
      id="letterInput"
      maxlength="10000"
      placeholder="在这里写下你的信..."
    ></textarea>

    <div
      class="count"
      id="count"
    >
      0 字
    </div>

    <button
      id="sendBtn"
      disabled
    >
      寄 出
    </button>

  </div>

</div>


<!-- 加载 -->

<div
  class="page"
  id="loadingPage"
>
  正在取信…
</div>


<!-- 分享 -->

<div
  class="page"
  id="sharePage"
>

  <div class="share-box">

    <div class="share-icon">
      ✉
    </div>

    <div class="share-title">
      信已经封好了
    </div>

    <div class="share-description">
      把下面的链接发送给对方<br>
      对方打开后会直接看到信封
    </div>

    <div id="shareURL"></div>

    <button
      class="share-button"
      id="copyBtn"
    >
      复制分享链接
    </button>

    <div class="two-buttons">

      <button
        class="secondary"
        id="systemShareBtn"
      >
        分享给朋友
      </button>

      <button
        class="secondary"
        id="previewBtn"
      >
        预览这封信
      </button>

    </div>

    <button id="againBtn">
      再写一封
    </button>

    <div id="shareStatus"></div>

  </div>

</div>


<!-- 信封 -->

<div
  class="page"
  id="envelopePage"
>

  <div
    class="envelope"
    id="envelope"
  >

    <div class="envelope-body"></div>

    <div class="envelope-flap"></div>

    <div class="seal">
      ✉
    </div>

  </div>

  <div class="open-tip">
    轻触打开
  </div>

</div>


<!-- 阅读 -->

<div
  class="page"
  id="readPage"
>

  <div
    class="paper"
    id="paper"
  >

    <div id="letterText"></div>

  </div>

</div>


<div id="replayTip">
  轻触屏幕 · 再读一遍
</div>


<script>

/* =========================
   Cloudflare Worker
========================= */

const API =
  "https://my-letter-api.226043950.workers.dev";


/* =========================
   DOM
========================= */

const writePage =
  document.getElementById("writePage");

const loadingPage =
  document.getElementById("loadingPage");

const sharePage =
  document.getElementById("sharePage");

const envelopePage =
  document.getElementById("envelopePage");

const readPage =
  document.getElementById("readPage");


const input =
  document.getElementById("letterInput");

const count =
  document.getElementById("count");

const sendBtn =
  document.getElementById("sendBtn");


const shareURL =
  document.getElementById("shareURL");

const copyBtn =
  document.getElementById("copyBtn");

const systemShareBtn =
  document.getElementById("systemShareBtn");

const previewBtn =
  document.getElementById("previewBtn");

const againBtn =
  document.getElementById("againBtn");

const shareStatus =
  document.getElementById("shareStatus");


const envelope =
  document.getElementById("envelope");

const paper =
  document.getElementById("paper");

const letterTextBox =
  document.getElementById("letterText");

const replayTip =
  document.getElementById("replayTip");


/* =========================
   粒子 Canvas
========================= */

const canvas =
  document.getElementById(
    "particleCanvas"
  );

const ctx =
  canvas.getContext("2d");


let canvasWidth = 0;

let canvasHeight = 0;

let dpr = 1;


function resizeCanvas(){

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvasWidth =
    window.innerWidth;

  canvasHeight =
    window.innerHeight;


  canvas.width =
    Math.round(
      canvasWidth * dpr
    );

  canvas.height =
    Math.round(
      canvasHeight * dpr
    );


  canvas.style.width =
    canvasWidth + "px";

  canvas.style.height =
    canvasHeight + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   状态
========================= */

let currentText = "";

let currentURL = "";

let typingTimer = null;

let finished = false;

let opening = false;


/* 粒子 */

let particles = [];

let particleAnimation = null;

let particleLastTime = 0;


/* =========================
   页面切换
========================= */

function hideAll(){

  writePage.style.display =
    "none";

  loadingPage.style.display =
    "none";

  sharePage.style.display =
    "none";

  envelopePage.style.display =
    "none";

  readPage.style.display =
    "none";

}


function showWrite(){

  hideAll();

  writePage.style.display =
    "flex";

}


function showLoading(){

  hideAll();

  loadingPage.style.display =
    "flex";

}


function showShare(){

  hideAll();

  sharePage.style.display =
    "flex";

}


function showEnvelope(){

  hideAll();

  stopParticles();

  opening = false;

  finished = false;


  envelope.classList.remove(
    "open"
  );


  paper.classList.remove(
    "disappear"
  );


  letterTextBox.textContent =
    "";


  paper.scrollTop = 0;


  replayTip.style.display =
    "none";


  envelopePage.style.display =
    "flex";

}


/* =========================
   输入
========================= */

input.addEventListener(
  "input",
  function(){

    const length =
      input.value.length;


    count.textContent =
      length + " 字";


    sendBtn.disabled =
      length === 0;

  }
);


/* =========================
   寄信
========================= */

sendBtn.addEventListener(
  "click",
  async function(){

    const text =
      input.value.trim();


    if(!text){
      return;
    }


    sendBtn.disabled =
      true;


    sendBtn.textContent =
      "寄送中…";


    try{

      const response =
        await fetch(
          API + "/letter",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                text:text
              })

          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.id
      ){

        throw new Error(
          data.error ||
          "创建失败"
        );

      }


      currentText =
        text;


      currentURL =
        window.location.origin +
        window.location.pathname +
        "?id=" +
        encodeURIComponent(
          data.id
        );


      shareURL.textContent =
        currentURL;


      showShare();


    }catch(error){

      alert(
        "寄信失败：" +
        error.message
      );

    }


    sendBtn.textContent =
      "寄 出";


    sendBtn.disabled =
      input.value.length === 0;

  }
);


/* =========================
   复制
========================= */

async function copyLink(){

  if(!currentURL){
    return;
  }


  try{

    await navigator.clipboard
      .writeText(currentURL);


    shareStatus.textContent =
      "✓ 链接已复制";


  }catch(error){


    const temp =
      document.createElement(
        "textarea"
      );


    temp.value =
      currentURL;


    temp.style.position =
      "fixed";

    temp.style.left =
      "-9999px";


    document.body.appendChild(
      temp
    );


    temp.select();


    try{

      document.execCommand(
        "copy"
      );


      shareStatus.textContent =
        "✓ 链接已复制";


    }catch(e){

      shareStatus.textContent =
        "请长按上方链接复制";

    }


    temp.remove();

  }

}


copyBtn.addEventListener(
  "click",
  copyLink
);


/* =========================
   系统分享
========================= */

systemShareBtn.addEventListener(
  "click",
  async function(){

    if(!currentURL){
      return;
    }


    if(navigator.share){

      try{

        await navigator.share({

          title:"一封信",

          text:
            "有一封信想给你。",

          url:
            currentURL

        });

      }catch(error){}

    }

    else{

      await copyLink();


      shareStatus.textContent =
        "链接已复制，可以直接发送";

    }

  }
);


/* =========================
   预览
========================= */

previewBtn.addEventListener(
  "click",
  function(){

    showEnvelope();

  }
);


/* =========================
   再写一封
========================= */

againBtn.addEventListener(
  "click",
  function(){

    history.replaceState(
      null,
      "",
      window.location.pathname
    );


    currentText = "";

    currentURL = "";


    input.value = "";


    count.textContent =
      "0 字";


    sendBtn.disabled =
      true;


    shareStatus.textContent =
      "";


    showWrite();

  }
);


/* =========================
   读取分享信件
========================= */

async function loadSharedLetter(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if(!id){

    showWrite();

    return;

  }


  showLoading();


  try{

    const response =
      await fetch(
        API +
        "/letter/" +
        encodeURIComponent(id)
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      typeof data.text !== "string"
    ){

      throw new Error(
        data.error ||
        "读取失败"
      );

    }


    currentText =
      data.text;


    showEnvelope();


  }catch(error){

    alert(
      "这封信无法打开：" +
      error.message
    );


    history.replaceState(
      null,
      "",
      window.location.pathname
    );


    showWrite();

  }

}


/* =========================
   打开信封
========================= */

envelope.addEventListener(
  "click",
  function(){

    if(
      opening ||
      !currentText
    ){
      return;
    }


    opening = true;


    envelope.classList.add(
      "open"
    );


    setTimeout(
      function(){

        hideAll();


        readPage.style.display =
          "flex";


        startTyping();

      },
      900
    );

  }
);


/* =========================
   打字机
========================= */

function startTyping(){

  if(typingTimer){

    clearTimeout(
      typingTimer
    );

  }


  stopParticles();


  letterTextBox.textContent =
    "";


  paper.classList.remove(
    "disappear"
  );


  paper.scrollTop =
    0;


  finished =
    false;


  let index =
    0;


  function typeNext(){


    if(
      index >=
      currentText.length
    ){

      /*
       * 最后一个字出现后
       * 精确等待 3 秒
       */

      typingTimer =
        setTimeout(
          startDissolve,
          3000
        );


      return;

    }


    const char =
      currentText[index];


    index++;


    letterTextBox.textContent =
      currentText.slice(
        0,
        index
      );


    if(
      paper.scrollHeight >
      paper.clientHeight
    ){

      paper.scrollTop =
        paper.scrollHeight;

    }


    let delay =
      75;


    if(
      "。！？!?…"
      .includes(char)
    ){

      delay =
        800;

    }

    else if(
      "，、；：,;:"
      .includes(char)
    ){

      delay =
        300;

    }


    typingTimer =
      setTimeout(
        typeNext,
        delay
      );

  }


  typeNext();

}


/* =========================
   创建消散粒子
========================= */

function createParticles(){

  particles = [];


  const rect =
    paper.getBoundingClientRect();


  /*
   * 手机性能优先：
   * 约 300 个粒子。
   */

  const amount =
    Math.min(
      360,
      Math.max(
        180,
        Math.floor(
          currentText.length * 2.2
        )
      )
    );


  const colors = [

    "rgba(255,236,200,1)",

    "rgba(245,211,157,1)",

    "rgba(226,186,126,1)",

    "rgba(255,222,172,1)",

    "rgba(238,202,147,1)"

  ];


  for(
    let i = 0;
    i < amount;
    i++
  ){

    /*
     * 粒子主要从信纸区域产生
     */

    const x =
      rect.left +
      Math.random() *
      rect.width;


    const y =
      rect.top +
      Math.random() *
      rect.height;


    const life =
      1100 +
      Math.random() *
      1300;


    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random() - 0.5) *
        0.65,

      vy:
        -0.15 -
        Math.random() *
        0.65,

      size:
        0.8 +
        Math.random() *
        1.8,

      life:life,

      maxLife:life,

      alpha:
        0.45 +
        Math.random() *
        0.5,

      color:
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ]

    });

  }

}


/* =========================
   粒子动画
========================= */

function animateParticles(time){

  if(
    !particleLastTime
  ){

    particleLastTime =
      time;

  }


  let delta =
    time -
    particleLastTime;


  particleLastTime =
    time;


  /*
   * 防止切后台后
   * delta 突然特别大
   */

  if(delta > 40){
    delta = 40;
  }


  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );


  let alive =
    0;


  for(
    let i = 0;
    i < particles.length;
    i++
  ){

    const p =
      particles[i];


    p.life -=
      delta;


    if(
      p.life <= 0
    ){
      continue;
    }


    alive++;


    /*
     * 轻微随机漂移
     */

    p.vx +=
      (Math.random() - 0.5) *
      0.012;


    /*
     * 缓慢向上
     */

    p.vy -=
      0.0008 *
      delta;


    p.x +=
      p.vx *
      delta *
      0.06;


    p.y +=
      p.vy *
      delta *
      0.06;


    /*
     * 越到后面越透明
     */

    const progress =
      p.life /
      p.maxLife;


    const alpha =
      p.alpha *
      Math.min(
        1,
        progress * 1.8
      );


    ctx.globalAlpha =
      alpha;


    ctx.fillStyle =
      p.color;


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );


    ctx.fill();

  }


  ctx.globalAlpha =
    1;


  if(alive > 0){

    particleAnimation =
      requestAnimationFrame(
        animateParticles
      );

  }

  else{

    /*
     * 所有粒子消失
     */

    stopParticles();


    finishLetter();

  }

}


/* =========================
   开始消散
========================= */

function startDissolve(){

  /*
   * 先生成粒子
   */

  createParticles();


  /*
   * 信纸与粒子同时开始消散
   */

  paper.classList.add(
    "disappear"
  );


  particleLastTime =
    0;


  particleAnimation =
    requestAnimationFrame(
      animateParticles
    );

}


/* =========================
   停止粒子
========================= */

function stopParticles(){

  if(
    particleAnimation
  ){

    cancelAnimationFrame(
      particleAnimation
    );

    particleAnimation =
      null;

  }


  particles =
    [];


  particleLastTime =
    0;


  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

}


/* =========================
   消散结束
========================= */

function finishLetter(){

  finished =
    true;


  replayTip.style.display =
    "block";

}


/* =========================
   再读一遍
========================= */

document.addEventListener(
  "click",
  function(event){

    if(!finished){
      return;
    }


    if(
      event.target.tagName ===
      "BUTTON"
    ){
      return;
    }


    if(typingTimer){

      clearTimeout(
        typingTimer
      );

    }


    finished =
      false;


    showEnvelope();

  }
);


/* =========================
   初始化
========================= */

window.addEventListener(
  "load",
  function(){

    loadSharedLetter();

  }
);

</script>
