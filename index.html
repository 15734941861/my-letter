<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #1b1714 0%,
      #100e0c 45%,

    serif;
}


/* =========================
   通用页面
========================= */

.page{

  top:0;
  left:0;

  width:100%;
  height:100%;

  display:none;

  overflow:auto;
}


/* =========================
   粒子画布
========================= */

#particleCanvas{
  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  z-index:550;

  pointer-events:none;
}


/* =========================
   写信首页
========================= */

#writePage{
  display:flex;

  z-index:100;

  align-items:center;
  justify-content:center;

  padding:24px;
}


.write-box{
  width:100%;
  max-width:560px;

  text-align:center;
}


.title{
  margin-bottom:14px;

  font-size:24px;

  font-weight:400;

  letter-spacing:0.45em;

  text-indent:0.45em;

  color:#f2dfbd;
}


.subtitle{
  margin-bottom:28px;

  font-size:13px;

  color:rgba(240,220,190,0.45);

  letter-spacing:0.12em;
}


#letterInput{
  display:block;

  width:100%;
  height:260px;

  padding:20px;

  border:
    1px solid
    rgba(240,200,140,0.22);

  border-radius:10px;

  outline:none;

  resize:none;

  background:
    rgba(255,245,225,0.045);

  color:#f1dfc3;

  font-family:inherit;

  font-size:16px;

  line-height:1.9;
}


#letterInput::placeholder{
  color:
    rgba(240,220,190,0.25);
}


.count{
  margin-top:10px;

  text-align:left;

  font-size:12px;

  color:
    rgba(240,220,190,0.38);
}


#sendBtn{
  margin-top:25px;

  min-width:150px;

  padding:13px 30px;

  border:
    1px solid
    rgba(240,200,140,0.38);

  border-radius:999px;

  background:
    rgba(255,235,200,0.04);

  color:#f2dfbd;

  font-family:inherit;

  font-size:15px;

  letter-spacing:0.3em;

  cursor:pointer;
}


#sendBtn:disabled{
  opacity:0.4;
}


/* =========================
   附件选择
========================= */

.media-picker{
  margin-top:16px;

  text-align:left;
}


.media-picker-control{
  position:relative;

  display:inline-flex;
}


#mediaInput{
  position:absolute;

  inset:0;

  z-index:2;

  width:100%;
  height:100%;

  opacity:0;

  cursor:pointer;
}


#mediaInput:disabled{
  cursor:not-allowed;
}


#mediaInput:focus-visible +
.media-picker-button{
  outline:
    2px solid
    rgba(240,200,140,0.58);

  outline-offset:3px;
}


.media-picker-button{
  display:inline-flex;

  min-height:38px;

  padding:8px 15px;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(240,200,140,0.2);

  border-radius:999px;

  background:
    rgba(255,245,225,0.035);

  color:
    rgba(242,223,189,0.82);

  font-size:12px;

  cursor:pointer;
}


.media-picker-button.disabled{
  opacity:0.4;

  pointer-events:none;
}


.media-hint{
  margin-top:8px;

  color:
    rgba(240,220,190,0.34);

  font-size:11px;

  line-height:1.6;
}


.selected-media-list{
  display:grid;

  margin-top:12px;

  gap:8px;
}


.selected-media-item{
  display:flex;

  min-width:0;

  padding:9px 11px;

  align-items:center;

  gap:10px;

  border:
    1px solid
    rgba(240,200,140,0.13);

  border-radius:8px;

  background:
    rgba(255,245,225,0.025);
}


.selected-media-thumb{
  width:42px;
  height:42px;

  flex:0 0 42px;

  border-radius:6px;

  object-fit:cover;

  background:
    rgba(255,245,225,0.05);
}


.selected-media-icon{
  display:flex;

  width:42px;
  height:42px;

  flex:0 0 42px;

  align-items:center;
  justify-content:center;

  border-radius:6px;

  background:
    rgba(255,245,225,0.05);

  font-size:18px;
}


.selected-media-info{
  min-width:0;

  flex:1;
}


.selected-media-name{
  overflow:hidden;

  color:
    rgba(242,223,189,0.76);

  font-size:12px;

  text-overflow:ellipsis;
  white-space:nowrap;
}


.selected-media-size{
  margin-top:3px;

  color:
    rgba(240,220,190,0.35);

  font-family:Arial,sans-serif;

  font-size:10px;
}


.remove-media-button{
  width:30px;
  height:30px;

  flex:0 0 30px;

  border:none;

  border-radius:50%;

  background:transparent;

  color:
    rgba(242,223,189,0.5);

  cursor:pointer;
}


#uploadStatus{
  min-height:18px;

  margin-top:8px;

  color:
    rgba(240,220,190,0.55);

  font-size:11px;
}


/* =========================
   加载
========================= */

#loadingPage{
  z-index:200;

  align-items:center;
  justify-content:center;

  color:
    rgba(240,220,190,0.55);

  font-size:14px;

  letter-spacing:0.25em;
}


/* =========================
   分享页面
========================= */

#sharePage{
  z-index:300;

  align-items:center;
  justify-content:center;

  padding:24px;
}


.share-box{
  width:100%;

.share-icon{

  width:66px;
  height:66px;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(240,200,140,0.25);

  font-size:28px;
}


.share-title{
  margin-bottom:12px;

  font-size:22px;

  letter-spacing:0.18em;
}


.share-description{
  margin-bottom:22px;

  color:
    rgba(240,220,190,0.48);

  font-size:13px;

  line-height:1.8;
}


#shareURL{
  width:100%;

  margin-bottom:18px;

  padding:14px;

  background:

  color:

  font-family:Arial,sans-serif;

  font-size:11px;

.share-button{
  width:100%;
  height:48px;

  margin-bottom:11px;

  border:
    1px solid
    rgba(240,200,140,0.32);

  border-radius:999px;

  background:
    rgba(255,235,200,0.055);

  color:#f2dfbd;

  font-family:inherit;

}


.two-buttons{
  display:flex;
  gap:10px;
}


.two-buttons button{
  flex:1;
}


.secondary{
  height:44px;

  border:
    1px solid
    rgba(240,200,140,0.18);

  border-radius:999px;

  background:transparent;

  color:
    rgba(242,223,189,0.75);

  font-family:inherit;
}


#againBtn{
  margin-top:17px;

  border:none;

  background:transparent;

  color:
    rgba(240,220,190,0.42);

  font-family:inherit;
}


#shareStatus{
  height:25px;

  margin-top:12px;

  color:
    rgba(240,220,190,0.55);

  font-size:12px;
}


/* =========================
   信封
========================= */

#envelopePage{
  z-index:400;

  align-items:center;
  justify-content:center;

  flex-direction:column;
}


.envelope{
  position:relative;

  width:260px;
  max-width:68vw;

  aspect-ratio:1.5 / 1;

  cursor:pointer;

  perspective:700px;

  animation:
    floatEnvelope
    3s
    ease-in-out
    infinite;
}


@keyframes floatEnvelope{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-9px);
  }

}


.envelope-body{
  position:absolute;

  inset:0;

  border-radius:6px;

  background:
    linear-gradient(
      145deg,
      #f7ead0,
      #e5d0a8
    );

  box-shadow:
    0 25px 55px
    rgba(0,0,0,0.55);
}


.envelope-flap{
  position:absolute;

  inset:0;

  background:
    linear-gradient(
      #e8d4ae,
      #d3bc90
    );

  clip-path:
    polygon(
      0 0,
      50% 58%,
      100% 0
    );

  transform-origin:top;

  transition:
    transform 0.8s ease;
}


.envelope.open .envelope-flap{
  transform:rotateX(180deg);
}


.seal{
  position:absolute;

  top:50%;
  left:50%;

  z-index:10;

  display:flex;

  width:48px;
  height:48px;

  align-items:center;
  justify-content:center;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #df5144,
      #9f2c23
    );

  box-shadow:
    0 5px 14px
    rgba(0,0,0,0.45);

  color:#f8e7c9;

  font-size:20px;

  transition:
    opacity 0.5s,
    transform 0.5s;
}


.envelope.open .seal{
  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(0.5);
}


.open-tip{
  margin-top:34px;

  color:
    rgba(240,220,190,0.52);

  font-size:13px;

  letter-spacing:0.35em;

  text-indent:0.35em;
}


/* =========================
   信纸
========================= */

#readPage{
  z-index:500;

  align-items:center;
  justify-content:center;

  padding:22px;
}


.paper{
  width:100%;
  max-width:620px;

  height:76vh;

  overflow:auto;

  padding:
    40px
    34px;

  border-radius:5px;

  background:
    radial-gradient(
      circle at 25% 5%,
      #fffef9,
      #f6eedf 60%,
      #eadfc9
    );

  box-shadow:
    0 35px 80px
    rgba(0,0,0,0.7);

  color:#3d342a;

  font-size:17px;

  line-height:2.1;

  letter-spacing:0.05em;

  opacity:1;

  transform:scale(1);

  filter:blur(0);

  transition:
    opacity 1.8s ease,
    transform 1.8s ease,
    filter 1.8s ease;
}


.paper.disappear{
  opacity:0;

  transform:
    translateY(-14px)
    scale(1.035);

  filter:blur(7px);
}


#letterText{
  white-space:pre-wrap;

  word-break:break-word;
}


#letterMedia{
  display:none;

  margin-top:28px;

  padding-top:24px;

  border-top:
    1px solid
    rgba(61,52,42,0.14);
}


#letterMedia.visible{
  display:grid;

  gap:16px;
}


.letter-media-label{
  color:
    rgba(61,52,42,0.58);

  font-size:12px;

  letter-spacing:0.15em;
}


.letter-media-image,
.letter-media-video{
  display:block;

  width:100%;

  max-height:58vh;

  border-radius:8px;

  background:#171411;

  object-fit:contain;
}


.letter-media-audio{
  display:block;

  width:100%;
}


.letter-media-name{
  overflow:hidden;

  color:
    rgba(61,52,42,0.48);

  font-family:Arial,sans-serif;

  font-size:10px;

  text-overflow:ellipsis;
  white-space:nowrap;
}


.read-again-button{
  min-height:40px;

  margin-top:8px;

  border:
    1px solid
    rgba(61,52,42,0.2);

  border-radius:999px;

  background:transparent;

  color:#594b3c;

  font-family:inherit;

  cursor:pointer;
}


/* =========================
   再读提示
========================= */

#replayTip{
  position:fixed;

  bottom:7vh;
  left:50%;

  z-index:600;

  display:none;

  transform:
    translateX(-50%);

  color:
    rgba(240,220,190,0.5);

  font-size:12px;

  letter-spacing:0.2em;

  white-space:nowrap;
}


@media(max-width:600px){

  #letterInput{
    height:230px;
  }

  .paper{
    height:72vh;

    padding:
      32px
      25px;

    font-size:16px;
  }

}

</style>
</head>


<body>


<!-- 粒子 -->
<canvas id="particleCanvas"></canvas>


<!-- 写信 -->

<div class="page" id="writePage">

  <div class="write-box">

    <h1 class="title">

<script>

/* =========================
   Cloudflare Worker
========================= */

const hostname =
  window.location.hostname;


const usesVercelProxy =
  hostname.endsWith(".webdatai.top") ||
  hostname.endsWith(".vercel.app");


const API =
  usesVercelProxy
    ? "/api"
    : "https://my-letter-api.226043950.workers.dev";


/* =========================
   DOM
========================= */

const writePage =
  document.getElementById("writePage");

const loadingPage =
  document.getElementById("loadingPage");

const sharePage =
  document.getElementById("sharePage");

const envelopePage =
  document.getElementById("envelopePage");

const readPage =
  document.getElementById("readPage");


const input =
  document.getElementById("letterInput");

const count =
  document.getElementById("count");

const sendBtn =
  document.getElementById("sendBtn");


const mediaInput =
  document.getElementById("mediaInput");

const mediaPickerButton =
  document.getElementById("mediaPickerButton");

const selectedMediaList =
  document.getElementById("selectedMediaList");

const uploadStatus =
  document.getElementById("uploadStatus");


const shareURL =
  document.getElementById("shareURL");

const copyBtn =
  document.getElementById("copyBtn");

const systemShareBtn =
  document.getElementById("systemShareBtn");

const previewBtn =
  document.getElementById("previewBtn");

const againBtn =
  document.getElementById("againBtn");

const shareStatus =
  document.getElementById("shareStatus");


const envelope =
  document.getElementById("envelope");

const paper =
  document.getElementById("paper");

const letterTextBox =
  document.getElementById("letterText");

const letterMedia =
  document.getElementById("letterMedia");

const replayTip =
  document.getElementById("replayTip");


/* =========================
   粒子 Canvas
========================= */

const canvas =
  document.getElementById(
    "particleCanvas"
  );

const ctx =
  canvas.getContext("2d");


let canvasWidth = 0;

let canvasHeight = 0;

let dpr = 1;


function resizeCanvas(){

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvasWidth =
    window.innerWidth;

  canvasHeight =
    window.innerHeight;


  canvas.width =
    Math.round(
      canvasWidth * dpr
    );

  canvas.height =
    Math.round(
      canvasHeight * dpr
    );


  canvas.style.width =
    canvasWidth + "px";

  canvas.style.height =
    canvasHeight + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   状态
========================= */

let currentText = "";

let currentURL = "";

let selectedMedia = [];

let currentAttachments = [];

let sending = false;

let typingTimer = null;

let finished = false;

let opening = false;


/* 粒子 */

let particles = [];

let particleAnimation = null;

let particleLastTime = 0;


/* =========================
   页面切换
========================= */

function hideAll(){

  writePage.style.display =
    "none";

  loadingPage.style.display =
    "none";

  sharePage.style.display =
    "none";

  envelopePage.style.display =
    "none";

  readPage.style.display =
    "none";

}


function showWrite(){

  hideAll();

  writePage.style.display =
    "flex";

}


function showLoading(){

  hideAll();

  loadingPage.style.display =
    "flex";

}


function showShare(){

  hideAll();

  sharePage.style.display =
    "flex";

}


function showEnvelope(){

  hideAll();

  stopParticles();

  opening = false;

  finished = false;


  envelope.classList.remove(
    "open"
  );


  paper.classList.remove(
    "disappear"
  );


  letterTextBox.textContent =
    "";


  letterMedia.replaceChildren();

  letterMedia.classList.remove(
    "visible"
  );


  paper.scrollTop = 0;


  replayTip.style.display =
    "none";


  envelopePage.style.display =
    "flex";

}


/* =========================
   附件
========================= */

const clientMediaRules = {
  "image/jpeg": { category:"image", maxBytes:5 * 1024 * 1024 },
  "image/png": { category:"image", maxBytes:5 * 1024 * 1024 },
  "image/webp": { category:"image", maxBytes:5 * 1024 * 1024 },
  "image/gif": { category:"image", maxBytes:5 * 1024 * 1024 },
  "audio/mpeg": { category:"audio", maxBytes:15 * 1024 * 1024 },
  "audio/mp4": { category:"audio", maxBytes:15 * 1024 * 1024 },
  "audio/aac": { category:"audio", maxBytes:15 * 1024 * 1024 },
  "audio/wav": { category:"audio", maxBytes:15 * 1024 * 1024 },
  "audio/webm": { category:"audio", maxBytes:15 * 1024 * 1024 },
  "video/mp4": { category:"video", maxBytes:30 * 1024 * 1024 },
  "video/webm": { category:"video", maxBytes:30 * 1024 * 1024 }
};


const clientCategoryLimits = {
  image:6,
  audio:1,
  video:1
};


function formatFileSize(bytes){

  if(bytes < 1024 * 1024){
    return Math.max(1, Math.round(bytes / 1024)) + " KB";
  }

  return (bytes / 1024 / 1024).toFixed(1) + " MB";

}


function clearSelectedMedia(){

  selectedMedia.forEach(
    function(item){

      if(item.previewURL){
        URL.revokeObjectURL(item.previewURL);
      }

    }
  );

  selectedMedia = [];

  mediaInput.value = "";

  renderSelectedMedia();

}


function renderSelectedMedia(){

  selectedMediaList.replaceChildren();

  selectedMedia.forEach(
    function(item, index){

      const row =
        document.createElement("div");

      row.className =
        "selected-media-item";


      if(item.rule.category === "image"){

        const image =
          document.createElement("img");

        image.className =
          "selected-media-thumb";

        image.src =
          item.previewURL;

        image.alt = "";

        row.appendChild(image);

      }

      else{

        const icon =
          document.createElement("div");

        icon.className =
          "selected-media-icon";

        icon.textContent =
          item.rule.category === "audio"
            ? "♫"
            : "▶";

        row.appendChild(icon);

      }


      const info =
        document.createElement("div");

      info.className =
        "selected-media-info";


      const name =
        document.createElement("div");

      name.className =
        "selected-media-name";

      name.textContent =
        item.file.name;


      const size =
        document.createElement("div");

      size.className =
        "selected-media-size";

      size.textContent =
        formatFileSize(item.file.size);


      const remove =
        document.createElement("button");

      remove.className =
        "remove-media-button";

      remove.type = "button";

      remove.textContent = "×";

      remove.setAttribute(
        "aria-label",
        "移除 " + item.file.name
      );

      remove.disabled = sending;

      remove.addEventListener(
        "click",
        function(){

          const removed =
            selectedMedia.splice(index, 1)[0];

          if(removed.previewURL){
            URL.revokeObjectURL(
              removed.previewURL
            );
          }

          renderSelectedMedia();

        }
      );


      info.appendChild(name);

      info.appendChild(size);

      row.appendChild(info);

      row.appendChild(remove);

      selectedMediaList.appendChild(row);

    }
  );

}


function addSelectedFiles(files){

  const next =
    selectedMedia.slice();


  for(const file of files){

    const rule =
      clientMediaRules[file.type];

    if(!rule){
      alert("不支持这个文件格式：" + file.name);
      continue;
    }

    if(file.size <= 0){
      alert("文件内容为空：" + file.name);
      continue;
    }

    if(file.size > rule.maxBytes){
      alert("文件过大：" + file.name);
      continue;
    }

    const categoryCount =
      next.filter(
        item => item.rule.category === rule.category
      ).length;

    if(categoryCount >= clientCategoryLimits[rule.category]){
      alert("该类型附件数量已达上限");
      continue;
    }

    const totalBytes =
      next.reduce(
        (total, item) => total + item.file.size,
        0
      ) + file.size;

    if(totalBytes > 40 * 1024 * 1024){
      alert("单封信附件总大小不能超过40 MB");
      continue;
    }

    next.push({
      file:file,
      rule:rule,
      previewURL:
        rule.category === "image"
          ? URL.createObjectURL(file)
          : ""
    });

  }


  selectedMedia = next;

  mediaInput.value = "";

  renderSelectedMedia();

}


mediaInput.addEventListener(
  "change",
  function(){

    addSelectedFiles(
      Array.from(mediaInput.files || [])
    );

  }
);


async function uploadSelectedMedia(letterId, uploadToken){

  const uploaded = [];


  for(
    let index = 0;
    index < selectedMedia.length;
    index++
  ){

    const item =
      selectedMedia[index];

    uploadStatus.textContent =
      "正在上传附件 " +
      (index + 1) +
      " / " +
      selectedMedia.length;


    const response =
      await fetch(
        API +
        "/letter/" +
        encodeURIComponent(letterId) +
        "/media",
        {
          method:"POST",
          headers:{
            "Content-Type":
              item.file.type,
            "X-Upload-Token":
              uploadToken,
            "X-File-Name":
              encodeURIComponent(
                item.file.name
              )
          },
          body:item.file
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.attachment){
      const error =
        new Error(
          data.error || "附件上传失败"
        );

      error.uploaded = uploaded;

      throw error;
    }


    uploaded.push(
      data.attachment
    );

  }


  return uploaded;

}


function attachmentURL(path){

  if(path.startsWith("/")){
    return API + path;
  }

  return path;

}


function renderLetterMedia(){

  letterMedia.replaceChildren();


  if(!currentAttachments.length){
    letterMedia.classList.remove("visible");
    return;
  }


  const label =
    document.createElement("div");

  label.className =
    "letter-media-label";

  label.textContent =
    "信里还放着这些";

  letterMedia.appendChild(label);


  currentAttachments.forEach(
    function(attachment){

      const source =
        attachmentURL(attachment.url);

      let media;


      if(attachment.type === "image"){

        media =
          document.createElement("img");

        media.className =
          "letter-media-image";

        media.loading = "lazy";

        media.alt =
          attachment.name || "信件图片";

      }

      else if(attachment.type === "audio"){

        media =
          document.createElement("audio");

        media.className =
          "letter-media-audio";

        media.controls = true;

        media.preload = "metadata";

      }

      else if(attachment.type === "video"){

        media =
          document.createElement("video");

        media.className =
          "letter-media-video";

        media.controls = true;

        media.preload = "metadata";

        media.playsInline = true;

      }


      if(!media){
        return;
      }


      media.src = source;

      letterMedia.appendChild(media);


      const name =
        document.createElement("div");

      name.className =
        "letter-media-name";

      name.textContent =
        attachment.name || "附件";

      letterMedia.appendChild(name);

    }
  );


  const readAgain =
    document.createElement("button");

  readAgain.className =
    "read-again-button";

  readAgain.type = "button";

  readAgain.textContent =
    "再读一遍";

  readAgain.addEventListener(
    "click",
    showEnvelope
  );

  letterMedia.appendChild(readAgain);

  letterMedia.classList.add("visible");

}


/* =========================
   输入
========================= */

input.addEventListener(
  "input",
  function(){

    const length =
      input.value.length;


    count.textContent =
      length + " 字";


    sendBtn.disabled =
      length === 0;

  }
);


/* =========================
   寄信
========================= */

sendBtn.addEventListener(
  "click",
  async function(){

    const text =
      input.value.trim();


    if(!text){
      return;
    }


    sending = true;


    sendBtn.disabled = true;

    mediaInput.disabled = true;

    mediaPickerButton.classList.add(
      "disabled"
    );

    renderSelectedMedia();


    sendBtn.textContent =
      "寄送中…";


    try{

      const response =
        await fetch(
          API + "/letter",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                text:text,
                wantsMedia:
                  selectedMedia.length > 0
              })

          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.id
      ){

        throw new Error(
          data.error ||
          "创建失败"
        );

      }


      currentText =
        text;


      currentAttachments = [];


      let uploadWarning = "";


      if(selectedMedia.length > 0){

        if(!data.uploadToken){
          throw new Error(
            "服务器没有返回附件上传授权"
          );
        }


        try{

          currentAttachments =
            await uploadSelectedMedia(
              data.id,
              data.uploadToken
            );

          uploadStatus.textContent =
            "附件上传完成";

        }catch(uploadError){

          currentAttachments =
            uploadError.uploaded || [];

          uploadWarning =
            "信件文字已寄出，但部分附件未能上传：" +
            uploadError.message;

        }

      }


      currentURL =
        window.location.origin +
        window.location.pathname +
        "?id=" +
        encodeURIComponent(
          data.id
        );


      shareURL.textContent =
        currentURL;


      showShare();


      if(uploadWarning){

        shareStatus.textContent =
          "部分附件上传失败，文字信仍可正常打开";

        alert(uploadWarning);

      }


    }catch(error){

      alert(
        "寄信失败：" +
        error.message
      );

    }


    sending = false;

    mediaInput.disabled = false;

    mediaPickerButton.classList.remove(
      "disabled"
    );

    renderSelectedMedia();


    sendBtn.textContent = "寄 出";


    sendBtn.disabled =
      input.value.length === 0;

  }
);


/* =========================
   复制
========================= */

async function copyLink(){

  if(!currentURL){
    return;
  }


  try{

    await navigator.clipboard
      .writeText(currentURL);


    shareStatus.textContent =
      "✓ 链接已复制";


  }catch(error){


    const temp =
      document.createElement(
        "textarea"
      );


    temp.value =
      currentURL;


    temp.style.position =
      "fixed";

    temp.style.left =
      "-9999px";


    document.body.appendChild(
      temp
    );


    temp.select();


    try{

      document.execCommand(
        "copy"
      );


      shareStatus.textContent =
        "✓ 链接已复制";


    }catch(e){

      shareStatus.textContent =
        "请长按上方链接复制";

    }


    temp.remove();

  }

}


copyBtn.addEventListener(
  "click",
  copyLink
);


/* =========================
   系统分享
========================= */

systemShareBtn.addEventListener(
  "click",
  async function(){

    if(!currentURL){
      return;
    }


    if(navigator.share){

      try{

        await navigator.share({

          title:"一封信",

          text:
            "有一封信想给你。",

          url:
            currentURL

        });

      }catch(error){}

    }

    else{

      await copyLink();


      shareStatus.textContent =
        "链接已复制，可以直接发送";

    }

  }
);


/* =========================
   预览
========================= */

previewBtn.addEventListener(

    showEnvelope();

  }
);


/* =========================
   再写一封
========================= */

againBtn.addEventListener(
  "click",
  function(){

    history.replaceState(
      null,
      "",
      window.location.pathname
    );


    currentText = "";

    currentURL = "";

    currentAttachments = [];


    clearSelectedMedia();


    uploadStatus.textContent = "";


    input.value = "";


    count.textContent =
      "0 字";


    sendBtn.disabled =
      true;


    shareStatus.textContent =
      "";


    showWrite();

  }
);


/* =========================
   读取分享信件
========================= */

async function loadSharedLetter(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if(!id){

    showWrite();

    return;

  }


  showLoading();


  try{

    const response =
      await fetch(
        API +
        "/letter/" +
        encodeURIComponent(id)
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      typeof data.text !== "string"
    ){

      throw new Error(
        data.error ||
        "读取失败"
      );

    }


    currentText =
      data.text;


    currentAttachments =
      Array.isArray(data.attachments)
        ? data.attachments.filter(
            attachment =>
              attachment &&
              typeof attachment.url === "string" &&
              ["image", "audio", "video"]
                .includes(attachment.type)
          )
        : [];


    showEnvelope();


  }catch(error){

    alert(
      "这封信无法打开：" +
      error.message
    );


    history.replaceState(
      null,
      "",
      window.location.pathname
    );


    showWrite();

  }

}


/* =========================
   打开信封
========================= */

envelope.addEventListener(
  "click",
  function(){

    if(
      opening ||
      !currentText
    ){
      return;
    }


    opening = true;


    envelope.classList.add(
      "open"
    );


    setTimeout(
      function(){

        hideAll();


        readPage.style.display =
          "flex";


        startTyping();

      },
      900
    );

  }
);


/* =========================
   打字机
========================= */

function startTyping(){

  if(typingTimer){

    clearTimeout(
      typingTimer
    );

  }


  stopParticles();


  letterTextBox.textContent =
    "";


  paper.classList.remove(
    "disappear"
  );


  paper.scrollTop =
    0;


  finished =
    false;


  let index =
    0;


  function typeNext(){


    if(
      index >=
      currentText.length
    ){


      if(currentAttachments.length > 0){

        renderLetterMedia();

        paper.scrollTop =
          paper.scrollHeight;

        return;

      }


      /*
       * 最后一个字出现后
       * 精确等待 3 秒
       */

      typingTimer =
        setTimeout(
          startDissolve,
          3000
        );


      return;

    }


    const char =
      currentText[index];


    index++;


    letterTextBox.textContent =
      currentText.slice(
        0,
        index
      );


    if(
      paper.scrollHeight >
      paper.clientHeight
    ){

      paper.scrollTop =
        paper.scrollHeight;

    }


    let delay =
      75;


    if(
      "。！？!?…"
      .includes(char)
    ){

      delay =
        800;

    }

    else if(
      "，、；：,;:"
      .includes(char)
    ){

      delay =
        300;

    }


    typingTimer =
      setTimeout(
        typeNext,
        delay
      );

  }


  typeNext();

}


/* =========================
   创建消散粒子
========================= */

function createParticles(){

  particles = [];


  const rect =
    paper.getBoundingClientRect();


  /*
   * 手机性能优先：
   * 约 300 个粒子。
   */

  const amount =
    Math.min(
      360,
      Math.max(
        180,
        Math.floor(
          currentText.length * 2.2
        )
      )
    );


  const colors = [

    "rgba(255,236,200,1)",

    "rgba(245,211,157,1)",

    "rgba(226,186,126,1)",

    "rgba(255,222,172,1)",

    "rgba(238,202,147,1)"

  ];


  for(
    let i = 0;
    i < amount;
    i++
  ){

    /*
     * 粒子主要从信纸区域产生
     */

    const x =
      rect.left +
      Math.random() *
      rect.width;


    const y =
      rect.top +
      Math.random() *
      rect.height;


    const life =
      1100 +
      Math.random() *
      1300;


    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random() - 0.5) *
        0.65,

      vy:
        -0.15 -
        Math.random() *
        0.65,

      size:
        0.8 +
        Math.random() *
        1.8,

      life:life,

      maxLife:life,

      alpha:
        0.45 +
        Math.random() *
        0.5,

      color:
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ]

    });

  }

}


/* =========================
   粒子动画
========================= */

function animateParticles(time){

  if(
    !particleLastTime
  ){

    particleLastTime =
      time;

  }


  let delta =
    time -
    particleLastTime;


  particleLastTime =
    time;


  /*
   * 防止切后台后
   * delta 突然特别大
   */

  if(delta > 40){
    delta = 40;
  }


  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );


  let alive =
    0;


  for(
    let i = 0;
    i < particles.length;
    i++
  ){

    const p =
      particles[i];


    p.life -=
      delta;


    if(
      p.life <= 0
    ){
      continue;
    }


    alive++;


    /*
     * 轻微随机漂移
     */

    p.vx +=
      (Math.random() - 0.5) *
      0.012;


    /*
     * 缓慢向上
     */

    p.vy -=
      0.0008 *
      delta;


    p.x +=
      p.vx *
      delta *
      0.06;


    p.y +=
      p.vy *
      delta *
      0.06;


    /*
     * 越到后面越透明
     */

    const progress =
      p.life /
      p.maxLife;


    const alpha =
      p.alpha *
      Math.min(
        1,
        progress * 1.8
      );


    ctx.globalAlpha =
      alpha;


    ctx.fillStyle =
      p.color;


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );


    ctx.fill();

  }


  ctx.globalAlpha =
    1;


  if(alive > 0){

    particleAnimation =
      requestAnimationFrame(
        animateParticles
      );

  }

  else{

    /*
     * 所有粒子消失
     */

    stopParticles();


    finishLetter();

  }

}


/* =========================
   开始消散
========================= */

function startDissolve(){

  /*
   * 先生成粒子
   */

  createParticles();


  /*
   * 信纸与粒子同时开始消散
   */

  paper.classList.add(
    "disappear"
  );


  particleLastTime =
    0;


  particleAnimation =
    requestAnimationFrame(
      animateParticles
    );

}


/* =========================
   停止粒子
========================= */

function stopParticles(){

  if(
    particleAnimation
  ){

    cancelAnimationFrame(
      particleAnimation
    );

    particleAnimation =
      null;

  }


  particles =
    [];


  particleLastTime =
    0;


  ctx.clearRect(
    0,
    0,
    canvasWidth,
    canvasHeight
  );

}


/* =========================
   消散结束
========================= */

function finishLetter(){

  finished =
    true;


  replayTip.style.display =
    "block";

}


/* =========================
   再读一遍
========================= */

document.addEventListener(
  "click",
  function(event){

    if(!finished){
      return;
    }


    if(
      event.target.tagName ===
      "BUTTON"
    ){
      return;
    }


    if(typingTimer){

      clearTimeout(
        typingTimer
      );

    }


    finished =
      false;


    showEnvelope();

  }
);


/* =========================
   初始化
========================= */

window.addEventListener(
  "load",
  function(){

    loadSharedLetter();

  }
);

</script>
